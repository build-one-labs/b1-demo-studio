# Workspace-owned Codex configuration. Personal model, permission and tool
# approval choices remain in ~/.codex/config.toml.

[mcp_servers.B1_Blueprint]
url = "http://localhost:3001/mcp/blueprint/dev"
env_http_headers = { "x-api-key" = "B1_CODEX_MCP_API_KEY", "Authorization" = "B1_CODEX_MCP_AUTH_HEADER" }

[mcp_servers.B1_Knowledge]
url = "http://localhost:3001/mcp/knowledge/dev"
env_http_headers = { "x-api-key" = "B1_CODEX_MCP_API_KEY", "Authorization" = "B1_CODEX_MCP_AUTH_HEADER" }

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
env_http_headers = { "CONTEXT7_API_KEY" = "CONTEXT7_API_TOKEN" }

# Disabled at launch when LINEAR_API_KEY is unset (start_codex.sh, codex-env.mjs).
[mcp_servers.linear]
url = "https://mcp.linear.app/mcp"
bearer_token_env_var = "LINEAR_API_KEY"
