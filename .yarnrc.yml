enableGlobalCache: false

nodeLinker: node-modules

npmRegistries:
  'https://buildone-653306034207.d.codeartifact.eu-central-1.amazonaws.com/npm/b1/':
    npmAuthToken: '${CODEARTIFACT_AUTH_TOKEN}'

npmScopes:
  buildone:
    npmRegistryServer: 'https://buildone-653306034207.d.codeartifact.eu-central-1.amazonaws.com/npm/b1/'
  fortawesome:
    npmRegistryServer: 'https://buildone-653306034207.d.codeartifact.eu-central-1.amazonaws.com/npm/b1/'

yarnPath: .yarn/releases/yarn-4.1.1.cjs

# Apple Silicon / arm64 host: amd64 runtime containers share this repo's
# bind-mounted node_modules. Fetch native bindings for both CPUs + libc so a
# single install satisfies the arm64 host tooling and the amd64 containers.
# See node_modules/@buildone/swat-cli/knowledge/architecture_info/local-devcontainer-setup.md ("arm64 host").
supportedArchitectures:
  os:
    - linux
  cpu:
    - x64
    - arm64
  libc:
    - glibc
    - musl
