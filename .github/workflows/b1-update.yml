name: B1 Update
run-name: B1 Update${{ inputs.version && format(' to {0}', inputs.version) || ' to the newest release' }}

# WHAT THIS IS
# Moving a repository to a newer Build.One release is one command — `b1 update
# <version>` — and everything it does is a file change: the @buildone packages
# move, the repository migrations that ship with them rewrite workflows, tasks
# and configuration, and the deployment files are regenerated. File changes
# belong in a pull request, reviewed and checked, rather than in whichever
# workspace happened to run the command and then had to push the result.
#
# So this runs the command on a runner and hands back a branch.
#
# WHY MANUAL ONLY
# There is no schedule here. Taking a new framework version is a decision with
# a release note attached, and a repository that wants it nightly can add a
# `schedule:` trigger below — the job resolves the newest published version on
# its own when no version is given, so it needs nothing else to run unattended.
#
# WORKFLOW FILES, AND WHO MAY PUSH THEM
# Nearly every release changes a workflow, and this job's GITHUB_TOKEN may not
# push a change under .github/workflows/ — GitHub offers no permission for it.
# So the push goes through `b1 publish-update`, which asks Build.One's token
# service for a token that may: the job shows its GitHub OIDC token (which
# proves the repository and workflow) and, if the Build.One GitHub App is
# installed on this repository, gets back a short-lived token for this
# repository alone. The App's key never leaves Build.One. Without the App the
# update still arrives: everything but the workflow changes is pushed, and those
# come as a patch in the pull request, with the commands that apply it.
#
# WHY THE CHECKS ARE SOMETIMES DISPATCHED
# GitHub does not start workflows for a pull request opened with GITHUB_TOKEN —
# the guard that stops a workflow creating work for itself forever. A pull
# request opened with the App's token gets its checks like any other. Without
# it, `b1 publish-update` asks for the runs named in `checks` explicitly; they
# appear as runs against the branch rather than as checks on the pull request,
# and the pull request says so.
#
# WHAT IT NEEDS
# The AUTH_URL and B1_ORG_API_KEY Actions secrets — the AWS credentials for the
# package registry are fetched with them — and, for the pull request itself,
# "Allow GitHub Actions to create and approve pull requests" enabled under
# Settings → Actions → General. Without that last one the branch is still
# pushed and the run says which setting to turn on. Optionally, the Build.One
# GitHub App installed on the repository, so workflow changes are pushed too.
#
# MERGING AND TAGGING
# Off by default: an update is reviewed like any other change. `merge` waits
# for every check on the pull request and squash-merges it when they pass.
# Those are the checks GitHub starts for it — the workflows that run on
# `pull_request` (Build, Help pages, Framework objects, …) — and nothing else:
# with the App there are such checks, so `checks` is not started. E2E runs
# nightly and on demand, not on pull requests, so a merge does not wait for it.
# `b1 publish-update` waits up to an hour, inside this job's two; a check made
# to run on pull requests and take longer leaves the pull request open, with
# this run red.
# `tag` also tags the merge commit, which starts whatever runs on tags
# (Publish), with a version of this repository — not the Build.One version it
# moved to, which is not one of this repository's releases:
#   auto       this repository's next version, worked out by GitVersion on the
#              merge commit as Publish Branch's `auto` does (e.g. 1.4.0-RC.7)
#   <version>  exactly that version
# Both need the Build.One GitHub App — the merge and the tag are made with its
# token — and leave the pull request open, with this run red, when a check
# fails. Build.One's starter repository, which is released under Build.One's
# own versions, is updated this way on every release, tagged with that release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to update to, e.g. 24.3.0-VG.412. Empty takes the newest published one.'
        required: false
        default: ''
      branch:
        description: 'Branch to open the pull request from. Empty uses b1-update/<version>.'
        required: false
        default: ''
      checks:
        description: 'Without the Build.One GitHub App: workflows to start against the new branch, since GitHub starts none for it. Empty starts none. With the App the pull request runs its own checks, and these are not started.'
        required: false
        default: 'build.yml e2e.yml'
      merge:
        description: 'Merge the pull request once every check on it passes: those that run on pull requests, not the nightly E2E (needs the Build.One GitHub App).'
        type: boolean
        default: false
      tag:
        description: 'Also tag the merge commit, which starts Publish (implies merge): "auto" for this repository''s next version from GitVersion, or an exact version. Empty tags nothing. Never the Build.One version, unless typed.'
        required: false
        default: ''

permissions:
  contents: write # push the update branch
  pull-requests: write # open the pull request
  actions: write # start the checks against it
  id-token: write # prove this run to Build.One's token service (workflow files)
  checks: read # wait for the pull request's checks, when merging
  statuses: read

# Two updates at once would race for the same branch name and leave two pull
# requests changing the same files. Queued rather than cancelled: a run that has
# already pushed should be allowed to finish opening its pull request.
concurrency:
  group: b1-update-${{ github.repository }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    # The update (minutes), and — when merging — the pull request's checks,
    # which `b1 publish-update` stops waiting for after an hour.
    timeout-minutes: 120
    env:
      # Every script `b1` launches resolves its paths from this; the CLI does
      # not derive it.
      WORKSPACE_ROOT: ${{ github.workspace }}
      # The dispatch inputs are read as environment, never interpolated into a
      # `run:` script. An expression is substituted before bash ever sees the
      # line, so a version string containing shell syntax would run as shell;
      # as environment it is data whatever it contains. They are validated
      # below as well, because a branch name is also a filesystem path.
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_BRANCH: ${{ inputs.branch }}
      INPUT_CHECKS: ${{ inputs.checks }}
      INPUT_MERGE: ${{ inputs.merge }}
      INPUT_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Where Build.One's token service is; `b1 publish-update` asks it for a
      # token that may push workflow files.
      AUTH_URL: ${{ secrets.AUTH_URL }}
    steps:
      - uses: actions/checkout@v5

      # One organization key, and the AWS pair the package registry needs comes
      # back from the secret store as job environment.
      - name: Fetch this repository's secrets
        uses: ./.github/actions/b1-secrets
        with:
          auth-url: ${{ secrets.AUTH_URL }}
          api-key: ${{ secrets.B1_ORG_API_KEY }}
          require: B1_ACCESS_KEY_ID B1_SECRET_ACCESS_KEY

      - uses: ./.github/actions/setup-node
        with:
          aws-access-key-id: ${{ env.B1_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.B1_SECRET_ACCESS_KEY }}
          focus-workspaces: app app-server-ts web-app data

      # `b1 update` installs the new CLI and then re-invokes `b1` — the new one,
      # which is the point — by name. Nothing puts the workspace binaries on
      # PATH on a runner, and without this the update stops halfway, having
      # changed package.json and nothing else.
      - name: Put the workspace binaries on PATH
        run: echo "${GITHUB_WORKSPACE}/node_modules/.bin" >> "${GITHUB_PATH}"

      # setup-node mints this for its own install and exports it; a repository
      # whose copy of the action does not is one `yarn add` away from a 401
      # that says nothing about why. Minted here only when it is missing.
      - name: Make sure the package registry stays authorised
        run: |
          set -euo pipefail
          if [[ -n "${CODEARTIFACT_AUTH_TOKEN:-}" ]]; then
            echo "Already authorised by setup-node."
            exit 0
          fi
          token=$(aws codeartifact get-authorization-token \
            --domain buildone --domain-owner 653306034207 \
            --region eu-central-1 --query authorizationToken --output text)
          echo "::add-mask::${token}"
          echo "CODEARTIFACT_AUTH_TOKEN=${token}" >> "${GITHUB_ENV}"

      - name: Work out which version to update to
        id: target
        run: |
          set -euo pipefail
          installed=$(jq -r '.version' node_modules/@buildone/swat-cli/package.json)

          version="${INPUT_VERSION}"
          if [[ -z "${version}" ]]; then
            # The newest release, as the CLI defines it: the highest
            # X.Y.Z-VG.N. Not the registry's own "newest", which is the highest
            # version by semver and so a feature build such as
            # 24.3.0-virtual-lars-app.1 — see scripts/update/newest-release.sh.
            version=$(b1 newest-release)
          fi

          # `b1 update` puts the version into a shell command and into
          # package.json, and the branch name below becomes a path on disk.
          # Both are checked here rather than trusted.
          if [[ ! "${version}" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]; then
            echo "::error title=B1 update::'${version}' is not a version string."
            exit 1
          fi

          # The tag becomes a git ref and a Docker image tag: a version, no
          # `+`, nothing git refuses in a ref. It was a checkbox before
          # B1-1361, so 'false' still means none and 'true' is refused.
          tag="${INPUT_TAG}"
          [[ "${tag}" == "false" ]] && tag=''
          if [[ -n "${tag}" && "${tag}" != "auto" ]] && ! [[ "${tag}" =~ ^[vV]?[0-9][0-9A-Za-z._-]*$ &&
            ${#tag} -le 128 && "${tag}" != *..* && "${tag}" != *. && "${tag}" != *.lock ]]; then
            echo "::error title=B1 update::'${tag}' is not a version to tag with: give a version such as 1.4.0-RC.3, or 'auto'."
            exit 1
          fi

          branch="${INPUT_BRANCH:-b1-update/${version}}"
          if [[ ! "${branch}" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ || "${branch}" == *".."* ]]; then
            echo "::error title=B1 update::'${branch}' is not a usable branch name."
            exit 1
          fi

          {
            echo "version=${version}"
            echo "installed=${installed}"
            echo "branch=${branch}"
            echo "tag=${tag}"
          } >> "${GITHUB_OUTPUT}"

          # Not a failure: "we are already there" is a perfectly good outcome
          # for a button somebody pressed to find out.
          if [[ "${version}" == "${installed}" ]]; then
            echo "current=true" >> "${GITHUB_OUTPUT}"
            echo "::notice title=B1 update::Already on ${installed} — nothing to update."
          else
            echo "current=false" >> "${GITHUB_OUTPUT}"
            echo "Updating ${installed} → ${version} on ${branch}"
          fi

      # Checked before the update rather than at the push, which is twenty
      # minutes later and has already rewritten the checkout.
      - name: Check the branch is free
        if: steps.target.outputs.current == 'false'
        env:
          BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "${BRANCH}" >/dev/null 2>&1; then
            echo "::error title=B1 update::${BRANCH} already exists. Merge or delete its pull request, or dispatch again with another branch name."
            exit 1
          fi

      - name: Update
        if: steps.target.outputs.current == 'false'
        env:
          VERSION: ${{ steps.target.outputs.version }}
          BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          set -euo pipefail
          git switch -c "${BRANCH}"
          # --yes because the confirmation this command opens with is about a
          # workspace's unexported blueprint work and a stack going down, and
          # there is neither here. A fresh checkout has no generated .deploy/,
          # so the update skips the stack entirely and is packages, migrations
          # and deployment files.
          b1 update "${VERSION}" --yes

      # Commit, push and open the pull request — in the CLI, which the step
      # above has just updated, so a fix to how updates are published reaches
      # this repository with the package rather than with another migration.
      - name: Publish the update
        id: publish
        if: steps.target.outputs.current == 'false'
        env:
          VERSION: ${{ steps.target.outputs.version }}
          INSTALLED: ${{ steps.target.outputs.installed }}
          BRANCH: ${{ steps.target.outputs.branch }}
          BASE: ${{ github.ref_name }}
          TAG: ${{ steps.target.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # The token service only serves Build.One customers, so it wants the
          # organization key too. Given to this step alone, not the whole job.
          B1_ORG_API_KEY: ${{ secrets.B1_ORG_API_KEY }}
        run: |
          set -euo pipefail
          if ! b1 publish-update --help > /dev/null 2>&1; then
            echo "::error title=B1 update::${VERSION} predates \`b1 publish-update\`. Update to a newer release, or run \`b1 update ${VERSION}\` in a workspace and push from there."
            exit 1
          fi
          release=()
          [[ "${INPUT_MERGE}" == "true" ]] && release+=(--merge)
          [[ -n "${TAG}" ]] && release+=(--tag "${TAG}")
          # Read whole rather than piped into `grep -q`, whose early exit
          # would fail the pipe under pipefail and read as "not supported".
          help="$(b1 publish-update --help)"
          if ((${#release[@]})) && [[ "${help}" != *--merge* ]]; then
            echo "::error title=B1 update::${VERSION} predates merging and tagging from \`b1 publish-update\`. Update without them."
            exit 1
          fi
          # An older CLI's --tag takes no version and tags the Build.One one.
          if [[ -n "${TAG}" && "${help}" != *"--tag <version|auto>"* ]]; then
            echo "::error title=B1 update::${VERSION} predates tagging with a version of this repository. Update with merge only, and create the release by hand."
            exit 1
          fi
          b1 publish-update --version "${VERSION}" --installed "${INSTALLED}" \
            --branch "${BRANCH}" --base "${BASE}" --run-url "${RUN_URL}" \
            --checks "${INPUT_CHECKS}" "${release[@]}"

      # The workflow changes this run could not push, when there were any — the
      # pull request carries them too unless they are too large for its body.
      - name: Keep the workflow patch
        if: steps.publish.outputs.patch != ''
        uses: actions/upload-artifact@v6
        with:
          name: b1-update-workflows-patch
          path: ${{ steps.publish.outputs.patch }}
          retention-days: 30

      - name: Summarise
        if: always() && steps.target.outputs.version != ''
        env:
          VERSION: ${{ steps.target.outputs.version }}
          INSTALLED: ${{ steps.target.outputs.installed }}
          BRANCH: ${{ steps.target.outputs.branch }}
          CURRENT: ${{ steps.target.outputs.current }}
          CHANGED: ${{ steps.publish.outputs.changed }}
          PR_URL: ${{ steps.publish.outputs.url }}
          MODE: ${{ steps.publish.outputs.mode }}
          MERGED: ${{ steps.publish.outputs.merged }}
          TAG: ${{ steps.publish.outputs.tag }}
        run: |
          {
            echo "### B1 Update"
            echo ""
            if [[ "${CURRENT}" == "true" ]]; then
              echo "Already on \`${INSTALLED}\`. Nothing to do."
            elif [[ -n "${PR_URL}" ]]; then
              echo "\`${INSTALLED}\` → \`${VERSION}\` on \`${BRANCH}\`."
              echo ""
              echo "${PR_URL}"
              if [[ "${MERGED}" == "true" ]]; then
                echo ""
                echo "Merged${TAG:+, and tagged \`${TAG}\`}."
              fi
              if [[ "${MODE}" == "split" ]]; then
                echo ""
                echo "⚠️ The workflow changes are in the pull request as a patch to apply by hand — install the Build.One GitHub App (https://github.com/apps/build-one-update-service) on this repository to have them pushed too."
              fi
            elif [[ "${CHANGED}" == "false" ]]; then
              echo "\`${VERSION}\` changed no files in this repository. No pull request opened."
            else
              echo "\`${INSTALLED}\` → \`${VERSION}\` did not finish. The log above says where it stopped."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
