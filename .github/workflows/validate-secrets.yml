name: Validate secrets

# WHY
# GitHub never returns a secret, so nothing outside a workflow run can say
# whether AUTH_URL and B1_ORG_API_KEY hold the values that were written — a
# listing answers "set", not "right". A run of this workflow is the one place
# the Actions copies can be read, so validation happens here: the dispatcher
# passes what it believes the values are, and each check ends as its own step
# whose conclusion the dispatcher reads back through the jobs API.
#
# STEP NAMES ARE THE PROTOCOL
# The onboarding application maps step name -> conclusion to build its verdict
# (see VALIDATION_STEPS in src/app-server-ts/src/server-actions/onboarding/
# onboarding.ts). Renaming a step here silently turns its check into "unknown"
# there, so the names change in both places or not at all.
#
# NOTHING SECRET CROSSES IN EITHER DIRECTION
# workflow_dispatch inputs are visible to anyone who can read the repository,
# so the key never travels as itself: the dispatcher sends a SHA-256 of
# "<check-id>:<key>" and this run computes the same digest from its own copy.
# The check id doubles as the salt, so a digest is dead the moment its run is
# over. The auth URL is an address, not a credential, and travels in the clear
# so a mismatch can be named. No step ever prints a secret — both are real
# Actions secrets here, so the runner would mask them anyway, but the
# discipline costs nothing.
#
# This validates the ACTIONS store. The Codespaces copy of the same pair is
# written in the same pass by the same code, but no workflow can read it — a
# codespace is the only thing that can.

on:
  workflow_dispatch:
    inputs:
      check-id:
        description: >
          Opaque id for this check. Echoed into the run name so the dispatcher
          can find its run, and the salt of org-api-key-digest.
        required: false
        default: ''
      auth-url:
        description: 'The AUTH_URL this repository is expected to hold. Empty skips the comparison.'
        required: false
        default: ''
      org-api-key-digest:
        description: >
          SHA-256 hex of "<check-id>:<key>" for the expected B1_ORG_API_KEY.
          Empty skips the comparison.
        required: false
        default: ''

run-name: "Validate secrets${{ inputs.check-id != '' && format(' {0}', inputs.check-id) || '' }}"

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    # A step `if:` cannot read the `secrets` context, so the pair comes through
    # job env — that is what lets the last step skip itself when either half is
    # missing rather than repeat a failure the first two steps already reported.
    env:
      AUTH_URL: ${{ secrets.AUTH_URL }}
      B1_ORG_API_KEY: ${{ secrets.B1_ORG_API_KEY }}
    steps:
      # `!cancelled()` on every step after the first, so one failed check does
      # not hide the others: the dispatcher gets a full row of verdicts from a
      # single run.
      - name: AUTH_URL is set
        run: |
          if [[ -z "${AUTH_URL}" ]]; then
            echo "::error title=AUTH_URL::The AUTH_URL Actions secret is not set on this repository."
            exit 1
          fi

      - name: B1_ORG_API_KEY is set
        if: ${{ !cancelled() }}
        run: |
          if [[ -z "${B1_ORG_API_KEY}" ]]; then
            echo "::error title=B1_ORG_API_KEY::The B1_ORG_API_KEY Actions secret is not set on this repository."
            exit 1
          fi

      - name: AUTH_URL matches
        if: ${{ !cancelled() && inputs.auth-url != '' }}
        env:
          EXPECTED: ${{ inputs.auth-url }}
        run: |
          # A trailing slash is not a different server.
          if [[ "${AUTH_URL%/}" != "${EXPECTED%/}" ]]; then
            echo "::error title=AUTH_URL::The AUTH_URL secret does not match the expected ${EXPECTED}."
            exit 1
          fi

      - name: B1_ORG_API_KEY matches
        if: ${{ !cancelled() && inputs.org-api-key-digest != '' }}
        env:
          CHECK_ID: ${{ inputs.check-id }}
          EXPECTED_DIGEST: ${{ inputs.org-api-key-digest }}
        run: |
          digest=$(printf '%s:%s' "${CHECK_ID}" "${B1_ORG_API_KEY}" | sha256sum | cut -d' ' -f1)
          if [[ "${digest}" != "${EXPECTED_DIGEST}" ]]; then
            echo "::error title=B1_ORG_API_KEY::The B1_ORG_API_KEY secret does not match the key on file for this repository."
            exit 1
          fi

      # Matching is necessary, working is the point: the same request a
      # workspace makes at startup and .github/actions/b1-secrets makes at the
      # top of every job. A pair that matches what was written but answers 401
      # here is a key revoked or a server that never minted it.
      - name: The pair authenticates
        if: ${{ !cancelled() && env.AUTH_URL != '' && env.B1_ORG_API_KEY != '' }}
        run: |
          url="${AUTH_URL%/}"
          case "${url}" in
            https://*) ;;
            *)
              echo "::error title=AUTH_URL::${url} is not https. Refusing to send the API key over an unencrypted connection."
              exit 1
              ;;
          esac
          code=$(curl -sS -o /dev/null --connect-timeout 10 --max-time 30 -w '%{http_code}' \
            -H "x-api-key: ${B1_ORG_API_KEY}" \
            "${url}/api/secrets/resolve-all") || {
            echo "::error title=AUTH_URL::Could not reach ${url} from this runner."
            exit 1
          }
          case "${code}" in
            200) echo "The key authenticates against ${url}." ;;
            401 | 403)
              echo "::error title=B1_ORG_API_KEY::${url} rejected the key. A key only works at the server that minted it — check where this one came from, and that it has not been revoked."
              exit 1
              ;;
            *)
              echo "::error title=AUTH_URL::${url} answered HTTP ${code}."
              exit 1
              ;;
          esac
