name: Neon Branch Sweep

# Delete dev Neon branches (`{user}/{git-branch}`) nobody has used for
# NEON_BRANCH_TTL_DAYS (default 7). neon-branch-cleanup.yml removes a branch
# when its PR closes; this catches the rest — git branches abandoned without a
# PR, and workspaces nobody went back to. "Used" is the branch's compute having
# run, not the branch's age, so a workspace that has been on one git branch for
# weeks keeps its database. Each user's `{user}/develop` is never swept.
#
# Every branch past the Neon plan's included ones is billed per branch-month, so
# a sweep that stops working costs money quietly. It fails, rather than skipping,
# when it cannot read its configuration, and writes how many branches it deleted
# and kept to the job summary. See .github/scripts/neon-cleanup.sh (B1-1255).
#
# Shipped to customer repositories by the 24.3.0-VG.467 migration, which keeps
# this file byte-for-byte identical to Vanguard's own; a test fails when the two
# drift.

on:
  schedule:
    - cron: '30 1 * * *' # 01:30 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    env:
      B1_ORG_API_KEY: ${{ secrets.B1_ORG_API_KEY }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # NEON_API_KEY and NEON_PROJECT_ID come from the auth server's store, like
      # every other provisioned value. See .github/actions/b1-secrets.
      #
      # Skipped when no key is configured yet, and the step below falls back to
      # Actions secrets/variables of the same names. A step `if:` cannot read the
      # `secrets` context, which is why the key comes through job env.
      - uses: ./.github/actions/b1-secrets
        if: env.B1_ORG_API_KEY != ''
        with:
          auth-url: ${{ secrets.AUTH_URL }}
          api-key: ${{ secrets.B1_ORG_API_KEY }}
          require: NEON_API_KEY NEON_PROJECT_ID
      - name: Sweep unused Neon branches
        env:
          # Fetched value first, the Actions secret/variable second. A step's env
          # beats what an earlier step wrote to $GITHUB_ENV, so a bare
          # `vars.NEON_PROJECT_ID` here would replace the fetched id with an empty
          # string — which is how this sweep skipped every run until B1-1255.
          NEON_API_KEY: ${{ env.NEON_API_KEY || secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ env.NEON_PROJECT_ID || vars.NEON_PROJECT_ID }}
        run: ./.github/scripts/neon-cleanup.sh ttl-sweep
