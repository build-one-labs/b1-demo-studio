name: Build

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [develop]
  pull_request: {}
  workflow_dispatch: {}

env:
  AWS_REGION: eu-central-1

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      app-server-ts: ${{ steps.filter.outputs.app-server-ts }}
      web-app: ${{ steps.filter.outputs.web-app }}
      yarn-lock: ${{ steps.filter.outputs.yarn-lock }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            app-server-ts:
              - 'src/app-server-ts/**'
            web-app:
              - 'src/web-app/**'
            yarn-lock:
              - 'yarn.lock'

  build-cache:
    env:
      B1_ORG_API_KEY: ${{ secrets.B1_ORG_API_KEY }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      always() &&
      (github.event_name != 'pull_request' || needs.detect-changes.outputs.yarn-lock == 'true')
    steps:
      - uses: actions/checkout@v6
      # Provisioned secrets from the auth server's store, with one organization
      # API key. Skipped until that key is set, and every value below then
      # falls back to the Actions secret it has always used.
      # See .github/actions/b1-secrets.
      - uses: ./.github/actions/b1-secrets
        if: env.B1_ORG_API_KEY != ''
        with:
          auth-url: ${{ secrets.AUTH_URL }}
          api-key: ${{ secrets.B1_ORG_API_KEY }}
          require: B1_ACCESS_KEY_ID B1_SECRET_ACCESS_KEY
      - uses: ./.github/actions/setup-node
        with:
          aws-access-key-id: ${{ env.B1_ACCESS_KEY_ID || secrets.B1_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.B1_SECRET_ACCESS_KEY || secrets.B1_SECRET_ACCESS_KEY }}

  build-app-server-ts:
    env:
      B1_ORG_API_KEY: ${{ secrets.B1_ORG_API_KEY }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      always() &&
      (github.event_name != 'pull_request' || needs.detect-changes.outputs.app-server-ts == 'true')
    steps:
      - uses: actions/checkout@v6
      # Provisioned secrets from the auth server's store, with one organization
      # API key. Skipped until that key is set, and every value below then
      # falls back to the Actions secret it has always used.
      # See .github/actions/b1-secrets.
      - uses: ./.github/actions/b1-secrets
        if: env.B1_ORG_API_KEY != ''
        with:
          auth-url: ${{ secrets.AUTH_URL }}
          api-key: ${{ secrets.B1_ORG_API_KEY }}
          require: B1_ACCESS_KEY_ID B1_SECRET_ACCESS_KEY
      - uses: ./.github/actions/setup-node
        with:
          aws-access-key-id: ${{ env.B1_ACCESS_KEY_ID || secrets.B1_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.B1_SECRET_ACCESS_KEY || secrets.B1_SECRET_ACCESS_KEY }}
          focus-workspaces: app app-server-ts
      - run: yarn workspace app-server-ts build

  lint-app-server-ts:
    env:
      B1_ORG_API_KEY: ${{ secrets.B1_ORG_API_KEY }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      always() &&
      (github.event_name != 'pull_request' || needs.detect-changes.outputs.app-server-ts == 'true')
    steps:
      - uses: actions/checkout@v6
      # Provisioned secrets from the auth server's store, with one organization
      # API key. Skipped until that key is set, and every value below then
      # falls back to the Actions secret it has always used.
      # See .github/actions/b1-secrets.
      - uses: ./.github/actions/b1-secrets
        if: env.B1_ORG_API_KEY != ''
        with:
          auth-url: ${{ secrets.AUTH_URL }}
          api-key: ${{ secrets.B1_ORG_API_KEY }}
          require: B1_ACCESS_KEY_ID B1_SECRET_ACCESS_KEY
      - uses: ./.github/actions/setup-node
        with:
          aws-access-key-id: ${{ env.B1_ACCESS_KEY_ID || secrets.B1_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.B1_SECRET_ACCESS_KEY || secrets.B1_SECRET_ACCESS_KEY }}
          focus-workspaces: app app-server-ts
      - run: yarn workspace app-server-ts lint

  build-web-app:
    env:
      B1_ORG_API_KEY: ${{ secrets.B1_ORG_API_KEY }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      always() &&
      (github.event_name != 'pull_request' || needs.detect-changes.outputs.web-app == 'true')
    steps:
      - uses: actions/checkout@v6
      # Provisioned secrets from the auth server's store, with one organization
      # API key. Skipped until that key is set, and every value below then
      # falls back to the Actions secret it has always used.
      # See .github/actions/b1-secrets.
      - uses: ./.github/actions/b1-secrets
        if: env.B1_ORG_API_KEY != ''
        with:
          auth-url: ${{ secrets.AUTH_URL }}
          api-key: ${{ secrets.B1_ORG_API_KEY }}
          require: B1_ACCESS_KEY_ID B1_SECRET_ACCESS_KEY
      - uses: ./.github/actions/setup-node
        with:
          aws-access-key-id: ${{ env.B1_ACCESS_KEY_ID || secrets.B1_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.B1_SECRET_ACCESS_KEY || secrets.B1_SECRET_ACCESS_KEY }}
          focus-workspaces: app web-app
      - run: yarn workspace web-app build

  lint-web-app:
    env:
      B1_ORG_API_KEY: ${{ secrets.B1_ORG_API_KEY }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      always() &&
      (github.event_name != 'pull_request' || needs.detect-changes.outputs.web-app == 'true')
    steps:
      - uses: actions/checkout@v6
      # Provisioned secrets from the auth server's store, with one organization
      # API key. Skipped until that key is set, and every value below then
      # falls back to the Actions secret it has always used.
      # See .github/actions/b1-secrets.
      - uses: ./.github/actions/b1-secrets
        if: env.B1_ORG_API_KEY != ''
        with:
          auth-url: ${{ secrets.AUTH_URL }}
          api-key: ${{ secrets.B1_ORG_API_KEY }}
          require: B1_ACCESS_KEY_ID B1_SECRET_ACCESS_KEY
      - uses: ./.github/actions/setup-node
        with:
          aws-access-key-id: ${{ env.B1_ACCESS_KEY_ID || secrets.B1_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.B1_SECRET_ACCESS_KEY || secrets.B1_SECRET_ACCESS_KEY }}
          focus-workspaces: app web-app
      - run: yarn workspace web-app lint
