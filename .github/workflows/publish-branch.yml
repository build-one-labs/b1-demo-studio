name: Publish Branch
run-name: Publish Branch ${{ inputs.version }}

# Dispatched by the Release & Deploy screen's "Create Release" action. Computes the
# version (GitVersion, or the exact `version` for "custom" mode), creates & pushes the
# tag, AND builds & publishes every image in the same run. Tagging alone (tag.yml) is
# avoided for this path because a GITHUB_TOKEN tag push does not fire publish.yml's
# push trigger, which would leave the tag un-built.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact tag to publish (or "auto" to compute from the branch)'
        required: false
        default: auto
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: auto
    secrets:
      AUTH_URL:
        required: false
      B1_ORG_API_KEY:
        required: false

# `contents: write` so the version job can push the tag; `statuses: write` so the
# marker job can set the commit status.
permissions:
  contents: write
  statuses: write

env:
  AWS_REGION: eu-central-1

jobs:
  # ---------------------------------------------------------------------------
  # Compute the version and create + push the tag on the dispatched branch.
  # ---------------------------------------------------------------------------
  version:
    env:
      B1_ORG_API_KEY: ${{ secrets.B1_ORG_API_KEY }}
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
      # Provisioned secrets from the auth server's store, with one organization
      # API key. See .github/actions/b1-secrets.
      - uses: ./.github/actions/b1-secrets
        with:
          auth-url: ${{ secrets.AUTH_URL }}
          api-key: ${{ secrets.B1_ORG_API_KEY }}
          require: B1_ACCESS_KEY_ID B1_SECRET_ACCESS_KEY
      # Credentials only: nothing below needs an install (B1-1493).
      - uses: aws-actions/configure-aws-credentials@v6
        if: inputs.version == '' || inputs.version == 'auto'
        with:
          aws-access-key-id: ${{ env.B1_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.B1_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: ./.github/actions/generate-version
        id: generated
        if: inputs.version == '' || inputs.version == 'auto'
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Create tag
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GENERATED_VERSION: ${{ steps.generated.outputs.version }}
        run: |
          # "auto" (or empty) uses the generated version from the branch;
          # an explicit value is used verbatim (the screen's "custom" mode).
          VERSION="${INPUT_VERSION:-auto}"
          if [ "${VERSION}" = "auto" ]; then VERSION="${GENERATED_VERSION}"; fi
          # refs/tags/: a branch or a commit hash with this name is not this tag.
          if TAGGED=$(git rev-parse -q --verify "refs/tags/${VERSION}^{commit}"); then
            if [ "${TAGGED}" != "$(git rev-parse HEAD)" ]; then
              echo "::error::Tag ${VERSION} already exists on ${TAGGED}, not on this commit, so this would publish other code. Dispatch a custom version, or dispatch on that commit to rebuild it. An automatic version repeats after a force-push, and a new commit gets a new one."
              exit 1
            fi
          else
            git tag "${VERSION}"
          fi
          git push origin "refs/tags/${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tagged $VERSION"

  # What publishing does is in publish-version.yml, shared with the other publish workflow.
  publish:
    needs: version
    permissions:
      contents: read
      statuses: write
    uses: ./.github/workflows/publish-version.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit
