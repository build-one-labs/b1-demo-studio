name: Database migrations

# Fails a pull request whose database migrations break the rules: more than one per
# pull request, an edited merged migration, a timestamp Drizzle would skip, no ticket in
# the name or the file. Runs `b1 check-migrations`, which judges only what the pull
# request adds, so migrations that are already merged cannot fail it. See
# node_modules/@buildone/swat-cli/knowledge/architecture_info/database-migrations.md.
#
# If a pull request truly needs two migrations, add the `multiple-migrations` label and
# say why in its description.

on:
  pull_request:
    branches:
      - develop
    # labeled and unlabeled: the multiple-migrations label changes the result.
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - 'src/app-server-ts/drizzle/**'
      - 'src/app-server-ts/src/drizzle/**'
      - '.github/workflows/database-migrations.yml'

permissions:
  contents: read

concurrency:
  group: database-migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Installing the CLI needs the package registry, and its credentials come from
  # the secret store through two Actions secrets. A repository that has not been
  # provisioned yet gets a notice here instead of a red check on every pull
  # request. A step `if:` cannot read the `secrets` context, hence a job.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    env:
      AUTH_URL: ${{ secrets.AUTH_URL }}
      B1_ORG_API_KEY: ${{ secrets.B1_ORG_API_KEY }}
    steps:
      - name: Check the credentials this run needs
        id: check
        run: |
          if [[ -n "${AUTH_URL}" && -n "${B1_ORG_API_KEY}" ]]; then
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice title=Database migrations skipped::AUTH_URL and B1_ORG_API_KEY are not set for this repository, so the CLI cannot be installed."
            echo "ready=false" >> "${GITHUB_OUTPUT}"
          fi

  check:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    services:
      # Throwaway: the migrations are applied here and the databases dropped afterwards.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      # Depth 2 for HEAD^1, the merge commit's first parent: exactly what this pull
      # request was merged with, even in a re-run after develop has moved.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Fetch this repository's secrets
        uses: ./.github/actions/b1-secrets
        with:
          auth-url: ${{ secrets.AUTH_URL }}
          api-key: ${{ secrets.B1_ORG_API_KEY }}
          require: B1_ACCESS_KEY_ID B1_SECRET_ACCESS_KEY

      - uses: ./.github/actions/setup-node
        with:
          aws-access-key-id: ${{ env.B1_ACCESS_KEY_ID || secrets.B1_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.B1_SECRET_ACCESS_KEY || secrets.B1_SECRET_ACCESS_KEY }}
          focus-workspaces: app app-server-ts data

      - name: Check the migrations
        env:
          WORKSPACE_ROOT: ${{ github.workspace }}
          B1_PR_TITLE: ${{ github.event.pull_request.title }}
          B1_ALLOW_MULTIPLE_MIGRATIONS: ${{ contains(github.event.pull_request.labels.*.name, 'multiple-migrations') }}
        run: yarn b1 check-migrations --base HEAD^1 --drift --apply postgres://postgres:postgres@localhost:5432/postgres
