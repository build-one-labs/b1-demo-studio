name: Database migrations

# Fails a pull request whose database migrations break the rules: more than one per
# pull request, an edited merged migration, a timestamp Drizzle would skip, no ticket in
# the name or the file. Runs `b1 check-migrations`, which judges only what the pull
# request adds, so migrations that are already merged cannot fail it. See
# node_modules/@buildone/swat-cli/knowledge/architecture_info/database-migrations.md.
#
# If a pull request truly needs two migrations, add the `multiple-migrations` label and
# say why in its description.

on:
  pull_request:
    branches:
      - develop
    # labeled and unlabeled: the multiple-migrations label changes the result.
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - 'src/app-server-ts/drizzle/**'
      - 'src/app-server-ts/src/drizzle/**'
      - '.github/workflows/database-migrations.yml'
      # The actions the check runs on, so a change that breaks one fails here and
      # not on the next pull request that touches a migration.
      - '.github/actions/b1-check-gate/**'
      - '.github/actions/b1-secrets/**'
      - '.github/actions/setup-node/**'

permissions:
  contents: read

concurrency:
  group: database-migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      # Throwaway: the migrations are applied here and the databases dropped afterwards.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      # Depth 2 for HEAD^1, the merge commit's first parent: exactly what this pull
      # request was merged with, even in a re-run after develop has moved.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      # Installing the CLI needs AUTH_URL and B1_ORG_API_KEY, and GitHub counts a job
      # whose steps were skipped as passed. The gate gives an unprovisioned repository a
      # notice, and fails a pull request from a fork or Dependabot (which GitHub gives no
      # Actions secrets) that changes a migration or the schema, because nothing checked
      # it. See node_modules/@buildone/swat-cli/knowledge/architecture_info/database-migrations.md.
      - name: Decide whether the check can run
        id: gate
        uses: ./.github/actions/b1-check-gate
        with:
          title: Database migrations
          # Whether this run has the two secrets, not their values.
          credentials: ${{ secrets.AUTH_URL != '' && secrets.B1_ORG_API_KEY != '' && 'present' || 'missing' }}
          paths: src/app-server-ts/drizzle src/app-server-ts/src/drizzle
          subject: the database migrations or schema
          command: yarn b1 check-migrations --base <base branch>

      - name: Fetch this repository's secrets
        if: steps.gate.outputs.run == 'true'
        uses: ./.github/actions/b1-secrets
        with:
          auth-url: ${{ secrets.AUTH_URL }}
          api-key: ${{ secrets.B1_ORG_API_KEY }}
          require: B1_ACCESS_KEY_ID B1_SECRET_ACCESS_KEY

      - uses: ./.github/actions/setup-node
        if: steps.gate.outputs.run == 'true'
        with:
          aws-access-key-id: ${{ env.B1_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.B1_SECRET_ACCESS_KEY }}
          focus-workspaces: app app-server-ts data

      - name: Check the migrations
        if: steps.gate.outputs.run == 'true'
        env:
          WORKSPACE_ROOT: ${{ github.workspace }}
          B1_PR_TITLE: ${{ github.event.pull_request.title }}
          B1_ALLOW_MULTIPLE_MIGRATIONS: ${{ contains(github.event.pull_request.labels.*.name, 'multiple-migrations') }}
        run: yarn b1 check-migrations --base HEAD^1 --drift --apply postgres://postgres:postgres@localhost:5432/postgres
