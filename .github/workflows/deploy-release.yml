name: Deploy Release
run-name: Deploy Release ${{ inputs.version }} to stack ${{ inputs.stack-id || inputs.stack-name || inputs.profile }}

# Dispatched by the Release & Deploy screen's "Deploy" action. Deploys a released
# version to a Portainer stack — either updating an existing stack (`stack-id`) or
# creating a new one (`stack-name` + `endpoint-id` + `domain`).
on:
  workflow_dispatch:
    inputs:
      stack-id:
        description: 'Portainer stack ID (update an existing stack; leave blank to create a new one)'
        required: false
        default: ''
      stack-name:
        description: 'New stack name (create a new stack; requires endpoint-id + app-url)'
        required: false
        default: ''
      endpoint-id:
        description: 'Portainer endpoint id (required when creating a new stack)'
        required: false
        default: ''
      app-url:
        description: 'App URL to serve the new stack at, without https://, e.g. app.example.com (required when creating)'
        required: false
      repository:
        description: 'Source repository (org/repo) recorded on the new stack'
        required: false
        default: ''
      version:
        description: 'Version to deploy (use "auto" for the latest tag)'
        required: true
        default: auto
      deployment-config:
        description: 'Deployment config file name (under .deploy/)'
        required: false
        default: standalone.docker-compose.yml
      portainer-url:
        description: 'Portainer URL (leave empty for the PORTAINER_URL secret)'
        required: false
        default: ''
      portainer-api-key:
        description: 'Portainer API key (leave empty for the PORTAINER_API_KEY secret)'
        required: false
        default: ''
      env-vars:
        description: 'Stack env vars, one per line: NAME=value, NAME= (empty), NAME- (remove). Not for secrets — these are visible in the run.'
        required: false
        default: ''
      env-secrets:
        description: 'Names of secret-store secrets to set as stack env vars (comma or newline separated). Names only — the values are resolved in the job.'
        required: false
        default: ''
      profile:
        description: 'Deployment profile to deploy (a b1_infra_deployment_profile in the repository). With it, stack-name only labels the run.'
        required: false
        default: ''
  workflow_call:
    inputs:
      stack-id:
        type: string
        required: false
        default: ''
      stack-name:
        type: string
        required: false
        default: ''
      endpoint-id:
        type: string
        required: false
        default: ''
      app-url:
        type: string
        required: false
        default: ''
      repository:
        type: string
        required: false
        default: ''
      version:
        type: string
        required: false
        default: auto
      deployment-config:
        type: string
        required: false
        default: standalone.docker-compose.yml
      portainer-url:
        type: string
        required: false
        default: ''
      portainer-api-key:
        type: string
        required: false
        default: ''
      env-vars:
        type: string
        required: false
        default: ''
      env-secrets:
        type: string
        required: false
        default: ''
      profile:
        type: string
        required: false
        default: ''
    secrets:
      AUTH_URL:
        required: false
      B1_ORG_API_KEY:
        required: false

permissions:
  contents: read

env:
  AWS_REGION: eu-central-1

jobs:
  deploy:
    env:
      B1_ORG_API_KEY: ${{ secrets.B1_ORG_API_KEY }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Provisioned secrets from the auth server's store, with one organization
      # API key. See .github/actions/b1-secrets.
      - uses: ./.github/actions/b1-secrets
        with:
          auth-url: ${{ secrets.AUTH_URL }}
          api-key: ${{ secrets.B1_ORG_API_KEY }}
          require: B1_ACCESS_KEY_ID B1_SECRET_ACCESS_KEY PORTAINER_API_KEY PORTAINER_URL PUBLISH_APP_NAME PUBLISH_DOCKER_REPOSITORY
      - uses: ./.github/actions/setup-node
        with:
          aws-access-key-id: ${{ env.B1_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.B1_SECRET_ACCESS_KEY }}
      - name: Resolve version
        id: version
        run: |
          VERSION="${B1_INPUT_VERSION}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "auto" ]; then
            VERSION=$(git describe --tags --abbrev=0)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        env:
          B1_INPUT_VERSION: ${{ inputs.version }}
      # The release's own files. This run, its local actions and the CLI installed
      # above come from the ref it was dispatched on — the default branch, because
      # a release tagged before this workflow existed has neither the workflow nor
      # the actions it calls. What is deployed must still be exactly what was
      # released, so the working tree moves to the tag before anything reads it.
      # node_modules is untracked and stays. The Release & Deploy screen dispatches
      # on the default branch only when it finds this step, so keep its id.
      - name: Check out the release
        id: checkout-release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! TARGET=$(git rev-parse --verify --quiet "refs/tags/${VERSION}^{commit}"); then
            echo "::error::There is no tag ${VERSION} in this repository to deploy."
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "${TARGET}" ]; then
            git -c advice.detachedHead=false checkout "${TARGET}"
          fi
      - name: Generate deployment files
        if: inputs.profile == ''
        env:
          WORKSPACE_ROOT: .
        run: npx b1 generate deployment
      # B1-1275: a stack described by a deployment profile object — rendered from the
      # repository's blueprint data, created or updated by name, then observed until
      # every service is ready. The profile and version reach the command through the
      # environment: a dispatch input interpolated into `run:` could inject a command.
      - name: Deploy with profile
        if: inputs.profile != ''
        env:
          WORKSPACE_ROOT: .
          B1_DEPLOY_PROFILE: ${{ inputs.profile }}
          B1_DEPLOY_VERSION: ${{ steps.version.outputs.version }}
          B1_DEPLOY_ENV_VARS: ${{ inputs.env-vars }}
          B1_DEPLOY_ENV_SECRETS: ${{ inputs.env-secrets }}
          PORTAINER_URL: ${{ inputs.portainer-url || env.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ inputs.portainer-api-key || env.PORTAINER_API_KEY }}
          AUTH_URL: ${{ env.AUTH_URL || secrets.AUTH_URL }}
        run: npx b1 deploy "${B1_DEPLOY_VERSION}" --profile "${B1_DEPLOY_PROFILE}"
      - name: Deploy to Portainer
        if: inputs.profile == ''
        env:
          B1_INPUT_PORTAINER_URL: ${{ inputs.portainer-url }}
          B1_INPUT_PORTAINER_API_KEY: ${{ inputs.portainer-api-key }}
          B1_STEPS_VERSION_VERSION: ${{ steps.version.outputs.version }}
          B1_INPUT_DEPLOYMENT_CONFIG: ${{ inputs.deployment-config }}
          B1_INPUT_STACK_ID: ${{ inputs.stack-id }}
          B1_INPUT_STACK_NAME: ${{ inputs.stack-name }}
          B1_INPUT_ENDPOINT_ID: ${{ inputs.endpoint-id }}
          B1_INPUT_REPOSITORY: ${{ inputs.repository }}
          # Through the environment, not expanded into the script: a crafted value would run commands in this job.
          B1_DEPLOY_APP_URL: ${{ inputs.app-url }}
          WORKSPACE_ROOT: .
          PUBLISH_DOCKER_REPOSITORY: ${{ env.PUBLISH_DOCKER_REPOSITORY }}
          PUBLISH_APP_NAME: ${{ env.PUBLISH_APP_NAME }}
          # Stack env vars reach the deploy through the environment, not the command
          # line the runner echoes. `secrets` cannot be indexed by a name computed
          # at run time, so the whole context is passed and b1 deploy picks out only
          # the names asked for.
          B1_DEPLOY_ENV_VARS: ${{ inputs.env-vars }}
          B1_DEPLOY_ENV_SECRETS: ${{ inputs.env-secrets }}
          # The auth server this deploy ran against, carried into the stack Env: every
          # service in the generated compose reads `${AUTH_URL:-http://auth_server:3000}`,
          # and that default only exists in a stack with a local auth server. b1 deploy
          # sets it on every deploy of a remote-auth stack, overwriting what the stack has.
          AUTH_URL: ${{ env.AUTH_URL || secrets.AUTH_URL }}
        run: |
          # From the environment, not expanded into this script: a stored value containing a
          # quote or $( would break the step or run commands in a job holding credentials.
          PORTAINER_URL="${B1_INPUT_PORTAINER_URL:-${PORTAINER_URL:-}}"
          PORTAINER_KEY="${B1_INPUT_PORTAINER_API_KEY:-${PORTAINER_API_KEY:-}}"
          npx b1 deploy \
            "${B1_STEPS_VERSION_VERSION}" \
            ".deploy/${B1_INPUT_DEPLOYMENT_CONFIG}" \
            "${B1_INPUT_STACK_ID}" \
            "$PORTAINER_URL" \
            "$PORTAINER_KEY" \
            --stack-name="${B1_INPUT_STACK_NAME}" \
            --endpoint-id="${B1_INPUT_ENDPOINT_ID}" \
            --app-url="${B1_DEPLOY_APP_URL}" \
            --repository="${B1_INPUT_REPOSITORY}"
