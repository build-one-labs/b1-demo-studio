name: Setup Node with CodeArtifact
description: Configure AWS credentials, get CodeArtifact token, setup Node.js, cache and install dependencies

inputs:
  aws-access-key-id:
    description: AWS access key ID
    required: true
  aws-secret-access-key:
    description: AWS secret access key
    required: true
  aws-region:
    description: AWS region
    required: false
    default: eu-central-1
  focus-workspaces:
    description: 'Workspaces to focus install on (empty = full install)'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}

    - name: Get CodeArtifact token
      shell: bash
      run: |
        TOKEN=$(aws codeartifact get-authorization-token \
          --domain buildone --domain-owner 653306034207 \
          --region ${{ inputs.aws-region }} --query authorizationToken --output text)
        if [ -z "$TOKEN" ]; then
          echo "ERROR: Failed to get CodeArtifact token"
          exit 1
        fi
        echo "CODEARTIFACT_AUTH_TOKEN=$TOKEN" >> "$GITHUB_ENV"

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Cache Yarn packages
      uses: actions/cache@v5
      with:
        path: .yarn/cache
        key: yarn-deps-${{ hashFiles('yarn.lock') }}
        restore-keys: yarn-deps-

    - name: Install dependencies
      shell: bash
      run: |
        if [ -z "${{ inputs.focus-workspaces }}" ]; then
          yarn install --immutable
        else
          yarn workspaces focus ${{ inputs.focus-workspaces }}
        fi

    - name: Fix script permissions
      shell: bash
      run: find node_modules -name "*.sh" -exec chmod +x {} \; 2>/dev/null || true
